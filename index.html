<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D24 Token Sale - Premium Web3 Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js" type="text/javascript"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --secondary: #ec4899;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg);
            background-image:
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(236, 72, 153, 0.15) 0px, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            transition: 0.5s;
        }

        .card:hover::before {
            left: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-item {
            background: var(--glass);
            padding: 16px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid var(--glass-border);
        }

        .stat-value {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
        }

        .tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            border-radius: 10px;
            transition: 0.3s;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-muted);
        }

        .tab.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-label {
            display: block;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 8px;
            margin-left: 4px;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px;
            color: white;
            font-size: 18px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.3);
        }

        .token-symbol {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-weight: 600;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: none;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(to right, var(--primary), var(--primary-hover));
            color: white;
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(99, 102, 241, 0.5);
        }

        .btn-secondary {
            background: var(--glass);
            color: white;
            border: 1px solid var(--glass-border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
        }

        .status-msg {
            margin-top: 16px;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        .status-success {
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.2);
            display: block;
        }

        .status-error {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
            display: block;
        }

        .wallet-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.1);
            padding: 8px 16px;
            border-radius: 100px;
            margin-bottom: 32px;
            border: 1px solid var(--glass-border);
        }

        .address {
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
        }

        .balance {
            font-size: 13px;
            color: var(--text-muted);
        }

        .hidden {
            display: none;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 100px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            width: 0%;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">
            <div class="header">
                <div class="logo">D24 TOKEN SALE</div>
                <div class="subtitle">Secure Buy & Sell Portal</div>
            </div>

            <div id="connect-section" class="text-center">
                <button id="connect-btn" class="btn btn-primary">
                    Connect MetaMask
                </button>
            </div>

            <div id="app-section" class="hidden">
                <div class="wallet-info">
                    <span id="user-address" class="address">0x...</span>
                    <span id="eth-balance" class="balance">0.00 ETH</span>
                </div>

                <div class="stats">
                    <div class="stat-item">
                        <div id="d24-balance" class="stat-value">0</div>
                        <div class="stat-label">Your D24</div>
                    </div>
                    <div class="stat-item">
                        <div id="total-sold" class="stat-value">0</div>
                        <div class="stat-label">Total Sold</div>
                    </div>
                </div>

                <div class="progress-bar-container">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>

                <div class="tabs">
                    <div id="buy-tab" class="tab active" onclick="setMode('buy')">BUY</div>
                    <div id="sell-tab" class="tab" onclick="setMode('sell')">SELL</div>
                </div>

                <div class="input-group">
                    <label id="input-label" class="input-label">Enter amount of tokens to buy</label>
                    <div class="input-wrapper">
                        <input type="number" id="token-amount" placeholder="0.0" min="1" oninput="updateEstimate()">
                        <span class="token-symbol">D24</span>
                    </div>
                </div>

                <div id="estimate-box" class="input-group" style="margin-top: -12px;">
                    <div class="stat-label" style="text-align: right;" id="estimate-text">Price: 0.001 ETH per D24</div>
                </div>

                <button id="action-btn" class="btn btn-primary">
                    Buy D24 Tokens
                </button>

                <div id="status-msg" class="status-msg"></div>
            </div>
        </div>

        <div class="footer">
            Powered by Charlie Blockchain Network & CHARUSAT
        </div>
    </div>

    <script>
        let provider, signer, tokenContract, saleContract;
        let mode = 'buy';
        const TOKEN_PRICE = ethers.utils.parseEther("0.001");

        const TOKEN_ADDRESS = "0xe3eAc745F4C2bD9244b526BbBdE63B14f423d163";
        const SALE_ADDRESS = "0x57ea97e9C41c3E4c6fa015d6De220b008dEc709E";

        const TOKEN_ABI = [
            "function balanceOf(address owner) view returns (uint256)",
            "function symbol() view returns (string)",
            "function approve(address spender, uint256 value) returns (bool)"
        ];

        const SALE_ABI = [
            "function buyTokens(uint256 _numberOfTokens) payable",
            "function sellTokens(uint256 _numberOfTokens)",
            "function tokensSold() view returns (uint256)",
            "function tokenPrice() view returns (uint256)"
        ];

        async function init() {
            console.log("Initializing Web3...");

            // Small delay to ensure MetaMask provider is injected
            await new Promise(resolve => setTimeout(resolve, 500));

            if (!window.ethereum) {
                console.error("MetaMask not found.");
                showStatus("MetaMask not found! If installed, please ensure it's enabled for this site.", "error");

                document.getElementById('connect-btn').onclick = async () => {
                    console.log("Retry connect...");
                    init();
                };
                return;
            }

            try {
                provider = new ethers.providers.Web3Provider(window.ethereum);
                const accounts = await provider.listAccounts();
                console.log("Connected accounts:", accounts);

                if (accounts.length > 0) {
                    await connectWallet();
                }

                document.getElementById('connect-btn').onclick = connectWallet;
                document.getElementById('action-btn').onclick = performAction;
            } catch (e) {
                console.error("Init error:", e);
                showStatus("Initialization error: " + e.message, "error");
            }
        }

        async function connectWallet() {
            try {
                console.log("Requesting accounts...");
                await provider.send("eth_requestAccounts", []);
                signer = provider.getSigner();
                const address = await signer.getAddress();
                console.log("Signer address:", address);

                const network = await provider.getNetwork();
                console.log("Network:", network);

                tokenContract = new ethers.Contract(TOKEN_ADDRESS, TOKEN_ABI, signer);
                saleContract = new ethers.Contract(SALE_ADDRESS, SALE_ABI, signer);

                document.getElementById('user-address').innerText = address.substring(0, 6) + "..." + address.substring(38);
                document.getElementById('connect-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');

                showStatus("Connected to " + address.substring(0, 8), "success");
                updateBalances();
                setInterval(updateBalances, 5000);
            } catch (err) {
                console.error("Connection failed:", err);
                showStatus("Connection failed: " + err.message, "error");
            }
        }

        async function updateBalances() {
            const address = await signer.getAddress();
            const ethBalance = await provider.getBalance(address);
            const d24Balance = await tokenContract.balanceOf(address);
            const sold = await saleContract.tokensSold();

            document.getElementById('eth-balance').innerText = ethers.utils.formatEther(ethBalance).substring(0, 6) + " ETH";
            document.getElementById('d24-balance').innerText = d24Balance.toString();
            document.getElementById('total-sold').innerText = sold.toString();

            const progress = (sold.toNumber() / 750000) * 100;
            document.getElementById('progress-bar').style.width = progress + "%";
        }

        function setMode(newMode) {
            mode = newMode;
            document.getElementById('buy-tab').classList.toggle('active', mode === 'buy');
            document.getElementById('sell-tab').classList.toggle('active', mode === 'sell');

            document.getElementById('input-label').innerText = mode === 'buy' ? 'Enter amount of tokens to buy' : 'Enter amount of tokens to sell';
            document.getElementById('action-btn').innerText = mode === 'buy' ? 'Buy D24 Tokens' : 'Sell D24 Tokens';
            updateEstimate();
        }

        function updateEstimate() {
            const amount = document.getElementById('token-amount').value || 0;
            const totalEth = amount * 0.001;
            document.getElementById('estimate-text').innerText = `Estimated: ${totalEth.toFixed(3)} ETH`;
        }

        async function performAction() {
            const amount = document.getElementById('token-amount').value;
            if (!amount || amount <= 0) {
                showStatus("Please enter a valid amount", "error");
                return;
            }

            const btn = document.getElementById('action-btn');
            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                if (mode === 'buy') {
                    const tx = await saleContract.buyTokens(amount, {
                        value: TOKEN_PRICE.mul(amount)
                    });
                    showStatus("Transaction sent! Waiting for confirmation...", "success");
                    await tx.wait();
                    showStatus("Successfully bought " + amount + " D24!", "success");
                } else {
                    // For selling, we first need to approve the sale contract
                    showStatus("Approving tokens for sale...", "success");
                    const approveTx = await tokenContract.approve(SALE_ADDRESS, amount);
                    await approveTx.wait();

                    showStatus("Approval confirmed. Selling tokens...", "success");
                    const sellTx = await saleContract.sellTokens(amount);
                    await sellTx.wait();
                    showStatus("Successfully sold " + amount + " D24!", "success");
                }
                updateBalances();
            } catch (err) {
                console.error(err);
                showStatus("Transaction failed: " + (err.reason || err.message), "error");
            } finally {
                btn.disabled = false;
                btn.innerText = mode === 'buy' ? 'Buy D24 Tokens' : 'Sell D24 Tokens';
            }
        }

        function showStatus(msg, type) {
            const el = document.getElementById('status-msg');
            el.innerText = msg;
            el.className = "status-msg " + (type === 'success' ? 'status-success' : 'status-error');
            setTimeout(() => {
                el.className = "status-msg";
            }, 8000);
        }

        window.onload = init;
    </script>

</body>

</html>
