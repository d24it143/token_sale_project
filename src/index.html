<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>D24IT143 Token Sale</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 100%;
        }

        .token-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .token-header h1 {
            font-weight: 800;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .progress {
            height: 1.5rem;
            border-radius: 1rem;
            background-color: #334155;
            margin: 2rem 0;
        }

        .progress-bar {
            background: linear-gradient(to right, #0ea5e9, #6366f1);
            border-radius: 1rem;
        }

        .btn-buy {
            background: linear-gradient(to right, #0ea5e9, #6366f1);
            border: none;
            padding: 0.8rem 2rem;
            font-weight: 600;
            border-radius: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-buy:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(14, 165, 233, 0.4);
        }

        .info-label {
            color: var(--text-dim);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .info-value {
            font-weight: 600;
            color: var(--accent-color);
        }

        #loader {
            text-align: center;
        }

        #content {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container d-flex justify-content-center">
        <div class="glass-card">
            <div class="token-header">
                <h1>D24IT143 Token Sale</h1>
                <p class="text-dim">Introducing our revolutionary cross-chain utility token.</p>
            </div>

            <div id="loader">
                <div class="spinner-border text-info" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3">Connecting to Blockchain...</p>
            </div>

            <div id="content">
                <div class="row text-center mb-4">
                    <div class="col">
                        <p class="info-label mb-1">Token Price</p>
                        <p><span class="token-price info-value"></span> ETH</p>
                    </div>
                    <div class="col">
                        <p class="info-label mb-1">Your Balance</p>
                        <p><span class="dapp-balance info-value"></span> D24</p>
                    </div>
                </div>

                <div class="mb-4">
                    <form onSubmit="App.buyTokens(); return false;" role="form">
                        <div class="input-group mb-3">
                            <input id="numberOfTokens" class="form-control bg-dark border-secondary text-white"
                                type="number" name="number" value="1" min="1" pattern="[0-9]*">
                            <button type="submit" class="btn btn-buy text-white">Buy Tokens</button>
                        </div>
                    </form>
                </div>

                <div class="progress">
                    <div id="progress" class="progress-bar progress-bar-striped progress-bar-animated"
                        role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
                <p class="text-center text-dim small">
                    <span class="tokens-sold"></span> / <span class="tokens-available"></span> tokens sold
                </p>

                <hr class="border-secondary opacity-25">

                <p id="accountAddress" class="text-center text-dim small"></p>
            </div>
        </div>
    </div>

    <!-- jQuery (necessary for Bootstrap's JavaScript plugins) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Web3 and Truffle-Contract -->
    <script src="https://cdn.jsdelivr.net/npm/web3/dist/web3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@truffle/contract/dist/truffle-contract.min.js"></script>
    <!-- App Logic -->
    <script src="js/app.js"></script>
</body>

</html>
